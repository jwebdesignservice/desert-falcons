<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Invert colours: black DFC becomes white, white bg becomes black -->
    <filter id="invert">
      <feComponentTransfer>
        <feFuncR type="linear" slope="-1" intercept="1"/>
        <feFuncG type="linear" slope="-1" intercept="1"/>
        <feFuncB type="linear" slope="-1" intercept="1"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <!-- Dark background -->
  <rect width="64" height="64" rx="6" fill="#000000"/>
  <!-- DFC mark: inverted so letters show white on the dark bg -->
  <image
    href="data:image/jpeg;base64,"
    x="2" y="12" width="60" height="40"
    preserveAspectRatio="xMidYMid meet"
    filter="url(#invert)"
  />
</svg>