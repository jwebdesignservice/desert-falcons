<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="portal.js"></script>
<script>
(async () => {
  const session = await requireAuth();
  if (!session) return;
  await initTopbar(session);

  let allUpdates = [];
  let activeFilter = 'all';

  const { data } = await _supabase
    .from('project_updates')
    .select('*')
    .order('created_at', { ascending: false });

  allUpdates = data || [];
  renderUpdates();

  document.getElementById('filterTabs').addEventListener('click', (e) => {
    const btn = e.target.closest('.filter-tab');
    if (!btn) return;
    activeFilter = btn.dataset.cat;
    document.querySelectorAll('.filter-tab').forEach(t => t.classList.toggle('active', t === btn));
    renderUpdates();
  });

  function renderUpdates() {
    const list = document.getElementById('updatesList');
    const items = activeFilter === 'all'
      ? allUpdates
      : allUpdates.filter(u => (u.category||'').toLowerCase() === activeFilter);

    if (!items.length) { list.innerHTML = '<div class="loading-text">No updates in this category yet.</div>'; return; }

    list.innerHTML = items.map(u => `
      <div class="update-card">
        <div class="update-header">
          <span class="update-title">${escapeHtml(u.title)}</span>
          ${statusBadgeHtml(u.status)}
        </div>
        <div class="update-meta">${escapeHtml(u.category)} · ${formatDate(u.created_at)}</div>
        <div class="update-body">${escapeHtml(u.body||'')}</div>
      </div>`).join('');
  }
})();
</script>
