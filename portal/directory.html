<script src="portal-i18n.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="portal.js"></script>
<script>
(async () => {
  const session = await requireAuth();
  if (!session) return;
  await initTopbar(session);
  const _t = k => window.dfc_i18n ? window.dfc_i18n.t(k) : k;

  let allMembers = [];
  let activeRole = 'all';
  let searchQuery = '';

  const { data } = await _supabase
    .from('members')
    .select('id, full_name, role, location, created_at')
    .order('created_at');

  allMembers = data || [];
  renderMembers();

  document.getElementById('roleFilter').addEventListener('click', (e) => {
    const btn = e.target.closest('.filter-tab');
    if (!btn) return;
    activeRole = btn.dataset.role;
    document.querySelectorAll('#roleFilter .filter-tab').forEach(t => t.classList.toggle('active', t === btn));
    renderMembers();
  });

  document.getElementById('searchInput').addEventListener('input', (e) => {
    searchQuery = e.target.value.toLowerCase();
    renderMembers();
  });

  function renderMembers() {
    const grid = document.getElementById('directoryGrid');
    let items = allMembers;

    if (activeRole !== 'all') {
      items = items.filter(m => (m.role || '').toLowerCase() === activeRole);
    }
    if (searchQuery) {
      items = items.filter(m =>
        (m.full_name || '').toLowerCase().includes(searchQuery) ||
        (m.location || '').toLowerCase().includes(searchQuery)
      );
    }

    if (!items.length) {
      grid.innerHTML = `<div class="loading-text">${_t('No members found.')}</div>`;
      return;
    }

    const locale = window.dfc_i18n?.isAr ? 'ar-SA' : 'en-US';
    grid.innerHTML = items.map(m => {
      const initials = getInitials(m.full_name);
      const role = m.role || 'member';
      const joinDate = new Date(m.created_at).toLocaleDateString(locale, { month: 'short', year: 'numeric' });
      return `
        <div class="member-card">
          <div class="member-card-avatar ${role.toLowerCase().replace('_','-')}">${initials}</div>
          <div class="member-card-name">${escapeHtml(m.full_name || 'Unknown')}</div>
          ${roleBadgeHtml(role)}
          ${m.location ? `<div class="member-card-location">📍 ${escapeHtml(m.location)}</div>` : ''}
          <div class="member-card-since">${_t('Joined')} ${joinDate}</div>
        </div>`;
    }).join('');
  }
})();
</script>
