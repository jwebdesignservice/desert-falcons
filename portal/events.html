<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="portal.js"></script>
<script>
(async () => {
  const session = await requireAuth();
  if (!session) return;
  await initTopbar(session);

  // Load events + user's RSVPs
  const [{ data: events }, { data: myRsvps }] = await Promise.all([
    _supabase.from('events').select('*').gte('event_date', new Date().toISOString()).order('event_date'),
    _supabase.from('event_rsvps').select('event_id').eq('member_id', session.user.id)
  ]);

  const rsvpSet = new Set((myRsvps || []).map(r => r.event_id));
  const list = document.getElementById('eventsList');

  if (!events || !events.length) {
    list.innerHTML = '<div class="loading-text">No upcoming events. Check back soon.</div>';
    return;
  }

  function eventTypeLabel(type) {
    const map = {
      design_review: 'Design Review',
      engineering_workshop: 'Engineering Workshop',
      investor_briefing: 'Investor Briefing',
      team_call: 'Team Call',
    };
    return map[type] || type;
  }

  function eventTypeClass(type) {
    const map = {
      design_review: 'designer',
      engineering_workshop: 'working_group',
      investor_briefing: 'investor',
      team_call: 'general',
    };
    return map[type] || 'general';
  }

  function renderEvents() {
    list.innerHTML = events.map(ev => {
      const evDate = new Date(ev.event_date);
      const dateStr = evDate.toLocaleDateString('en-US', { weekday: 'short', day: 'numeric', month: 'long', year: 'numeric' });
      const timeStr = evDate.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', timeZoneName: 'short' });
      const going = rsvpSet.has(ev.id);
      return `
        <div class="event-card" id="ev-${ev.id}">
          <div class="event-date-block">
            <div class="event-day">${evDate.getDate()}</div>
            <div class="event-month">${evDate.toLocaleDateString('en-US', { month: 'short' }).toUpperCase()}</div>
          </div>
          <div class="event-body">
            <div class="event-title">${escapeHtml(ev.title)}</div>
            <div class="event-meta">
              <span class="role-badge ${eventTypeClass(ev.event_type)}">${eventTypeLabel(ev.event_type)}</span>
              <span class="event-time">📅 ${dateStr} · ${timeStr}</span>
            </div>
            ${ev.description ? `<div class="event-desc">${escapeHtml(ev.description)}</div>` : ''}
          </div>
          <div class="event-rsvp">
            ${going
              ? `<button class="btn-going" disabled>Going ✓</button>`
              : `<button class="btn-rsvp" onclick="rsvp('${ev.id}')">RSVP</button>`
            }
          </div>
        </div>`;
    }).join('');
  }

  window.rsvp = async function(eventId) {
    const { error } = await _supabase.from('event_rsvps').insert({
      event_id: eventId,
      member_id: session.user.id
    });
    if (!error) {
      rsvpSet.add(eventId);
      renderEvents();
    }
  };

  renderEvents();
})();
</script>
