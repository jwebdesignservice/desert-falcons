<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="portal.js"></script>
<script>
(async () => {
  const session = await requireAuth();
  if (!session) return;
  await initTopbar(session);

  let allResources = [];
  let activeFilter = 'all';

  const { data } = await _supabase
    .from('resources')
    .select('*')
    .order('created_at', { ascending: false });

  allResources = data || [];
  renderResources();

  document.getElementById('filterTabs').addEventListener('click', (e) => {
    const btn = e.target.closest('.filter-tab');
    if (!btn) return;
    activeFilter = btn.dataset.cat;
    document.querySelectorAll('.filter-tab').forEach(t => t.classList.toggle('active', t === btn));
    renderResources();
  });

  function getFileIcon(type) {
    const t = (type || '').toUpperCase();
    if (t === 'PDF') return '📄';
    if (t === 'EXCEL' || t === 'XLS' || t === 'XLSX') return '📊';
    if (t === 'PPT' || t === 'PPTX') return '📋';
    if (t === 'IMAGE' || t === 'PNG' || t === 'JPG') return '🖼️';
    if (t === 'CAD') return '📐';
    return '📎';
  }

  function categoryLabel(cat) {
    const map = {
      design_briefs: 'Design Brief',
      engineering_specs: 'Engineering',
      investor_materials: 'Investor',
      meeting_notes: 'Meeting Notes',
      brand_assets: 'Brand Assets',
    };
    return map[cat] || cat;
  }

  function renderResources() {
    const grid = document.getElementById('resourcesGrid');
    const items = activeFilter === 'all'
      ? allResources
      : allResources.filter(r => r.category === activeFilter);

    if (!items.length) {
      grid.innerHTML = '<div class="loading-text">No resources in this category yet.</div>';
      return;
    }

    grid.innerHTML = items.map(r => `
      <div class="resource-card">
        <div class="resource-icon">${getFileIcon(r.file_type)}</div>
        <div class="resource-info">
          <div class="resource-title">${escapeHtml(r.title)}</div>
          <div class="resource-meta">
            <span class="type-badge ${(r.file_type||'').toLowerCase()}">${escapeHtml(r.file_type || 'File')}</span>
            <span class="resource-cat">${categoryLabel(r.category)}</span>
            <span class="resource-date">Added ${formatDate(r.created_at)}</span>
          </div>
        </div>
        <div class="resource-action">
          ${r.file_url
            ? `<a href="${escapeHtml(r.file_url)}" target="_blank" class="btn-download">Download</a>`
            : `<span class="btn-download disabled">Coming Soon</span>`
          }
        </div>
      </div>`).join('');
  }
})();
</script>
